name: "Update Angular Action"

on: 
  schedule:
    - cron: '30 5 * * 1,3,5'
  workflow_dispatch: 
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  ngxUptodate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history + credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0             # get full history so pushes can be fast-forward checked
          persist-credentials: true  # allow subsequent git push using GITHUB_TOKEN

      - name: Configure git for pushes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure remote branch refs are available
        run: |
          git fetch --all --prune
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install local project dependencies
        run: npm ci
        working-directory: ./crud-angular

      - name: Updating ng dependencies 
        uses: fast-facts/ng-update@v1
        with:
          base-branch: main
          project-path: ./crud-angular
          repo-token: ${{ secrets.GITHUB_TOKEN }}